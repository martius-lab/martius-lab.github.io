<!-- third party scripts, served from this site (see _vendor/fetch.py) -->
<script src="{{ "assets/vendor/popper.min.js" | relative_url }}" defer></script>
<script src="{{ "assets/vendor/tippy.min.js" | relative_url }}" defer></script>
<script src="{{ "assets/vendor/mark.min.js" | relative_url }}" defer></script>

<!-- include all js in scripts folder -->
{% assign scripts = site.static_files | where_exp: "file", "file.path contains '/_scripts'" %}
{% for script in scripts %}
  <script src="{{ script.path | relative_url }}"></script>
{% endfor %}
