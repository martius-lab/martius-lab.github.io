<!-- fonts and icons, served from this site (see _vendor/fetch.py) -->
<link href="{{ "assets/vendor/fonts/fonts.css" | relative_url }}" rel="stylesheet">

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "assets/vendor/fontawesome/css/all.min.css" | relative_url %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
