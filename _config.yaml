# site properties and page defaults
title: Autonomous Learning Group
subtitle: University of Tübingen
description: >-
  The Autonomous Learning Group (Distributed Intelligence) at the University of Tübingen
  studies how embodied agents can learn autonomously: reinforcement learning,
  representation learning, intrinsic motivation, and haptic sensing.
header: images/group/2026-schruns.webp
footer: images/group/2026-schruns.webp
proofer: false

# site social media and other links
links:
  email: georg.martius@uni-tuebingen.de
  github: martius-lab

# legal pages of the university, linked in the footer
legal:
  imprint: https://uni-tuebingen.de/en/imprint/
  privacy: https://uni-tuebingen.de/en/data-privacy-statement/

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # markdown files in /_projects
  - scope:
      type: "projects"
    values:
      layout: project

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  # generate page for each research project
  projects:
    output: true
    permalink: /research/:name/

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - CLAUDE.md
  - content
  - _data/*.bib

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
